# TaxDesk theme: Notes to Accounts.
# Each module is a statement whose figures point to numbered notes holding the working
# (an annual report's statements and Notes to Accounts). Navy binding, white statement
# sheets on a cool grey ground, ochre note references. Details in ui_common.py and DESIGN.md.

[theme]
base = "light"
primaryColor = "#14213D"              # report navy: primary buttons, selected controls
backgroundColor = "#F3F5F8"           # cool grey ground behind the white statement sheets
secondaryBackgroundColor = "#E9EDF3"  # input wells
textColor = "#14213D"
linkColor = "#14213D"
borderColor = "#D5DBE5"
dataframeBorderColor = "#E1E6EE"
dataframeHeaderBackgroundColor = "#F3F5F8"
showWidgetBorder = true
baseRadius = "2px"
buttonRadius = "2px"
font = "'Public Sans', sans-serif"
headingFont = "'Source Serif 4', serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
codeFont = "monospace"                # bundled Source Code Pro, for the email drafts
redColor = "#B42318"
greenColor = "#1F7A4D"
orangeColor = "#8F5E06"

[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/fonts/public-sans-latin.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/fonts/public-sans-latin-ext.woff2"   # carries the rupee sign
weight = "100 900"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Source Serif 4"
url = "app/static/fonts/source-serif-4-latin.woff2"
weight = "200 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Source Serif 4"
url = "app/static/fonts/source-serif-4-latin-ext.woff2"
weight = "200 900"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[theme.sidebar]
backgroundColor = "#14213D"           # report navy binding
secondaryBackgroundColor = "#1E2E52"
textColor = "#E3E8F2"
borderColor = "#2A3B62"
primaryColor = "#E0A93A"
linkColor = "#E0A93A"

[server]
maxUploadSize = 25          # MB; large enough for a year of invoices
enableStaticServing = true  # serves static/fonts for the theme

[client]
toolbarMode = "viewer"      # hide developer menu items such as "Deploy"

[browser]
gatherUsageStats = false
