# =============================================================================
# TaxDesk rules file: Tax Year 2026-27 (1 Apr 2026 to 31 Mar 2027)
# =============================================================================
# EVERY rate, slab, limit and date used by the app lives here. The Python code
# reads these values; it never hardcodes them.
#
# The Income-tax Act, 2025 replaced the Income-tax Act, 1961 from 1 Apr 2026.
# Old section numbers are kept next to the new ones because CAs, Form 16s
# and most articles still use the old numbers.
#
# STATUS: values were cross-checked against secondary sources (Budget 2026
# coverage, ICAI/CBDT section mapping summaries) on 2026-11-24. Before relying
# on any figure, check it against the primary source named in its comment.
# A `section_new: null` means the new section number has NOT been confirmed yet.
#
# Primary sources (referred to by the short tags below):
#   [ITA25]   Income-tax Act, 2025 (bare Act): https://www.incometaxindia.gov.in
#   [MAP]     CBDT / ICAI table mapping ITA 2025 sections to ITA 1961 sections
#   [FA25]    Finance Act, 2025 (rates first set for the new regime from FY 25-26)
#   [FA26]    Finance Act, 2026 / Budget speech 1 Feb 2026 (slabs unchanged)
#   [FA24]    Finance (No. 2) Act, 2024 (capital-gains rates from 23 Jul 2024)
#   [FA23]    Finance Act, 2023 (debt mutual funds, old s.50AA)
#   [FA18]    Finance Act, 2018 (grandfathering of equity LTCG, old s.112A)
#   [CBIC]    CBIC GST notifications: https://cbic-gst.gov.in
#   [GSTN]    GSTN GSTIN structure: https://tutorial.gst.gov.in
# =============================================================================

meta:
  tax_year: "2026-27"
  fy_start: 2026-04-01
  fy_end: 2027-03-31
  rules_last_checked: 2026-11-24
  disclaimer: "Educational project. Not tax advice. Verify all figures before filing."

# -----------------------------------------------------------------------------
# Income tax: individuals below 60, resident. Surcharge NOT modelled.
# -----------------------------------------------------------------------------
income_tax:
  cess_rate: 0.04                     # Health & Education Cess 4% on tax [FA26]
  surcharge_warning_above: 5000000    # Surcharge starts above Rs 50 lakh [FA26]; app only warns
  senior_citizen_age: 60              # Different old-regime slabs from 60 [FA26]; not modelled, app warns
  rounding:
    income_to_nearest: 10             # Total income rounded to nearest Rs 10 [ITA25] (old s.288A)
    tax_to_nearest: 10                # Tax payable rounded to nearest Rs 10 [ITA25] (old s.288B)

  new_regime:
    section_new: "202"                # [MAP] new s.202 = old s.115BAC
    section_old: "115BAC"
    standard_deduction: 75000         # Salary standard deduction, new regime [FA25], unchanged [FA26]
    slabs:                            # [FA25] Part I First Schedule, unchanged by [FA26]
      - {upto: 400000,  rate: 0.00}
      - {upto: 800000,  rate: 0.05}
      - {upto: 1200000, rate: 0.10}
      - {upto: 1600000, rate: 0.15}
      - {upto: 2000000, rate: 0.20}
      - {upto: 2400000, rate: 0.25}
      - {upto: null,    rate: 0.30}   # null = no upper limit
    rebate:
      section_new: "156"              # [MAP] new s.156 = old s.87A
      section_old: "87A"
      max_rebate: 60000               # [FA25]
      income_limit: 1200000           # Rebate only if total income <= Rs 12 lakh [FA25]
      marginal_relief: true           # Tax capped at (income - 12 lakh) just above the limit [FA25]
      not_available_on_special_rate_income: true   # Rebate can't be set off against tax on
                                                   # equity STCG/LTCG [FA25 proviso]; used in Module 3

  old_regime:
    standard_deduction: 50000         # [ITA25] salary standard deduction, old regime (same as old s.16(ia))
    slabs:                            # [FA26] Part I First Schedule (below 60 years)
      - {upto: 250000,  rate: 0.00}
      - {upto: 500000,  rate: 0.05}
      - {upto: 1000000, rate: 0.20}
      - {upto: null,    rate: 0.30}
    rebate:
      section_new: "156"              # [MAP]
      section_old: "87A"
      max_rebate: 12500               # [ITA25] old regime rebate
      income_limit: 500000            # [ITA25]
      marginal_relief: false

  deductions:                         # Old regime only (not allowed in the new regime)
    sec_123:
      label: "Section 123 (formerly 80C)"
      section_new: "123"              # [MAP] confirmed in multiple sources
      section_old: "80C"
      limit: 150000                   # Aggregate limit Rs 1.5 lakh [ITA25]
    sec_126:
      label: "Section 126 (formerly 80D)"
      section_new: "126"              # [MAP]
      section_old: "80D"
      limit_self_family: 25000        # Health insurance, self/spouse/children below 60 [ITA25]
      limit_parents: 25000            # Parents below 60 [ITA25]
      limit_parents_senior: 50000     # Parents 60+ [ITA25]
      limit_total_max: 75000          # Self (<60) + senior parents; app caps the entered total here
    home_loan_interest:
      label: "Home-loan interest, self-occupied (formerly s.24(b))"
      section_new: null               # VERIFY in [MAP] before showing a number
      section_old: "24(b)"
      limit: 200000                   # Self-occupied property cap [ITA25]
    hra_exemption:
      label: "HRA exemption (formerly s.10(13A))"
      section_new: null               # VERIFY in [MAP]
      section_old: "10(13A)"
      limit: null                     # Entered as a number by the user for now (no cap applied)

  house_property:
    standard_deduction_rate: 0.30     # 30% of Net Annual Value on let-out property [ITA25] (old s.24(a))

# -----------------------------------------------------------------------------
# Capital gains on mutual fund units (Module 3)
# -----------------------------------------------------------------------------
capital_gains:
  equity:                             # Equity-oriented funds (>= 65% Indian equity), STT paid
    long_term_after_months: 12        # Long term if held MORE than 12 months [ITA25] (old s.2(42A))
    stcg_rate: 0.20                   # Transfers on/after 23 Jul 2024 [FA24] (old s.111A)
    ltcg_rate: 0.125                  # [FA24] (old s.112A)
    ltcg_exemption: 125000            # First Rs 1.25 lakh of yearly equity LTCG exempt [FA24]
    grandfathering:                   # [FA18] (old s.112A / s.55(2)(ac))
      acquired_before: 2018-02-01     # Applies to units bought on or before 31 Jan 2018
      fmv_date: 2018-01-31            # Cost = max(actual cost, min(FMV on this date, sale value))
  debt:
    specified_fund_from: 2023-04-01   # Bought on/after this date: always short term, slab rate [FA23] (old s.50AA)
    long_term_after_months: 24        # Bought before 1 Apr 2023: long term if held > 24 months [FA24]
    ltcg_rate: 0.125                  # Without indexation, transfers on/after 23 Jul 2024 [FA24]
    stcg_taxed_at: "slab"
  other:                              # Gold/international FoFs, hybrid < 65% equity, etc.
    long_term_after_months: 24        # [FA24]
    ltcg_rate: 0.125                  # [FA24]
    stcg_taxed_at: "slab"
    note: "Specified-fund definition changed from 1 Apr 2025 (funds with > 65% in debt). Review each 'other' scheme manually."

# -----------------------------------------------------------------------------
# GST (Module 1)
# -----------------------------------------------------------------------------
gst:
  gstin:
    length: 15                        # [GSTN] 2 state + 10 PAN + 1 entity no. + 'Z' + 1 check char
    default_char_position_14: "Z"     # [GSTN] 14th character is 'Z' by default
    valid_state_codes:                # [GSTN] state codes 01-38, plus 97 (Other Territory) and 99 (Centre Jurisdiction)
      range: [1, 38]
      extra: [97, 99]
  rates_percent: [0, 5, 18, 40]       # GST rate slabs after rationalisation from 22 Sep 2025 [CBIC]
  home_state_code: 27                 # Sample client is in Maharashtra (27); intra-state = CGST+SGST

# -----------------------------------------------------------------------------
# App settings (not tax law, kept here so all tunable numbers sit in one place)
# -----------------------------------------------------------------------------
app_settings:
  gst_matching:
    amount_tolerance_rs: 1.0          # Max difference in each tax head still called "Matched"
    fuzzy_invoice_threshold: 90       # rapidfuzz ratio (0-100) for "Probable match"
  default_financial_year: "2026-27"
